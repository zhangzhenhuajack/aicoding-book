services:
  postgres:
    image: postgres:16
    container_name: teampulse-postgres
    environment:
      POSTGRES_USER: teampulse
      POSTGRES_PASSWORD: teampulse
      POSTGRES_DB: teampulse
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teampulse -d teampulse"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
