[project]
name = "teampulse-backend"
version = "1.0.0"
description = "TeamPulse 租户邀请功能后端（演示）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic[email]>=2.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.16",
    "mypy>=1.11",
    "import-linter>=2.1",
    "mutmut>=2.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID"]
# B008：FastAPI 的 Depends() 作为参数默认值是官方惯用法，这里豁免。
ignore = ["B008"]
# TID251 可用于禁止特定导入；分层主要靠 import-linter 强制。

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["mutmut.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
    "integration: 需要真实 Postgres 的集成测试（无 docker 时自动 skip）",
]

[tool.coverage.run]
source = ["app"]

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "分层架构：api → services → domain；services → repositories → db"
type = "layers"
layers = [
    "app.api",
    "app.services",
    "app.repositories",
    "app.domain",
]
# 说明：domain 在最底层，不得向上依赖；db 由 repositories 独占访问。

[[tool.importlinter.contracts]]
name = "domain 纯净：不得依赖框架与基础设施"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = ["fastapi", "sqlalchemy", "app.db", "app.api"]

[[tool.importlinter.contracts]]
name = "api 不得越过 service 直连 repository / db 模型"
type = "forbidden"
source_modules = ["app.api"]
forbidden_modules = ["app.repositories", "app.db.models"]
allow_indirect_imports = "true"
# 只禁直接导入；api → services → repositories 的间接路径是合法的分层调用。
