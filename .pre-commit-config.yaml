# 提交前秒级门禁。rev 均为真实存在的 tag（git ls-remote 核实 2026-10-08）。
# 安装：pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff            # lint
        args: [--fix]
        files: ^backend/
      - id: ruff-format     # format
        files: ^backend/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks        # 密钥扫描，命中即阻断

  - repo: local
    hooks:
      - id: import-linter   # 分层契约：api→services→domain, services→repositories→db
        name: lint-imports (layering contract)
        entry: bash -c 'cd backend && uv run lint-imports'
        language: system
        pass_filenames: false
        files: ^backend/app/
